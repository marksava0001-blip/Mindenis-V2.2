name: Habit reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder check
        run: |
          curl -sf -X POST "https://mindenis-v2-2.vercel.app/api/send-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
