name: Habit reminders

on:
  # Offset from the exact 5-minute boundary (:00, :05, :10...) — GitHub's
  # scheduler queues everyone's jobs at those marks, which is exactly when
  # runs get delayed or silently dropped under load. Starting at :02 avoids
  # that pile-up.
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder check
        run: |
          curl -sf -X POST "https://mindenis-v2-2.vercel.app/api/send-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
